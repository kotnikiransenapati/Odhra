<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- X-Frame-Options must be set via HTTP headers, not meta tags -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(self), payment=(self)" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.algolia.net https://*.algolianet.com https://lumberjack-cx.razorpay.com https://api.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; media-src 'self' blob: https:; worker-src 'self' blob:;" />
    
    <!-- CRITICAL: Preconnect hints MUST be first for maximum benefit -->
    <!-- Supabase REST uses same-origin mode (apikey header), so no crossorigin attribute -->
    <link rel="preconnect" href="https://sckugugzlgoihoviqoid.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- DNS Prefetch for secondary domains -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://wpwca46raw-dsn.algolia.net" />
    
    <!-- PWA Meta Tags -->
    
    <!-- Preload critical fonts to prevent layout shifts -->
    <link rel="preload" href="https://fonts.gstatic.com/s/outfit/v15/QGYvz_MVcBeNP4NJtEtqUYLknw.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://fonts.gstatic.com/s/outfit/v15/QGYvz_MVcBeNP4NJuktqUYLkn8BJ.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- Fonts loaded asynchronously to prevent render blocking -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=optional" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=optional" /></noscript>
    
    <!-- Inline critical font-face to ensure immediate text rendering -->
    <style>
      /* Fallback font sizing to match Outfit metrics and prevent CLS */
      @font-face {
        font-family: 'Outfit Fallback';
        src: local('Arial');
        ascent-override: 100%;
        descent-override: 25%;
        line-gap-override: 0%;
        size-adjust: 100%;
      }
      @font-face {
        font-family: 'DM Sans Fallback';
        src: local('Arial');
        ascent-override: 94%;
        descent-override: 26%;
        line-gap-override: 0%;
        size-adjust: 105%;
      }
      /* Apply fallback immediately to prevent layout shift */
      html {
        font-family: 'Outfit', 'Outfit Fallback', system-ui, sans-serif;
      }
    </style>
    
    <!-- PWA Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <title>Odhra - Luxury Marketplace</title>
    <meta name="description" content="Where luxury meets innovation. Discover curated collections from premium vendors on Odhra marketplace." />
    <meta name="author" content="Odhra" />
    <meta name="keywords" content="luxury, marketplace, premium, fashion, curated, vendors" />

    <!-- Open Graph -->
    <meta property="og:title" content="Odhra - Luxury Marketplace" />
    <meta property="og:description" content="Where luxury meets innovation. Discover curated collections from premium vendors." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://odhra1.lovable.app/" />
    <meta property="og:site_name" content="Odhra" />
    <meta property="og:image" content="https://odhra1.lovable.app/pwa-512x512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Odhra" />
    <meta name="twitter:image" content="https://odhra1.lovable.app/pwa-512x512.png" />

    <!-- Organization structured data -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"Organization","name":"Odhra","url":"https://odhra1.lovable.app/","logo":"https://odhra1.lovable.app/pwa-512x512.png"}
    </script>
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    
    <!-- Prevent flash of unstyled content -->
    <script>
      (function() {
        const theme = localStorage.getItem('odhra-ui-theme') || 'system';
        const root = document.documentElement;
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          root.classList.remove('light');
          root.classList.add('dark');
        }
      })();
    </script>

    <!-- Inline critical CSS for instant first paint (FCP optimization) -->
    <style>
      #root-shell{display:flex;flex-direction:column;min-height:100vh;background:var(--background,#fafafa)}
      .dark #root-shell{background:var(--background,#1e293b)}
      #root-shell .shell-header{height:56px;border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;padding:0 16px}
      .dark #root-shell .shell-header{border-bottom-color:rgba(255,255,255,.06)}
      #root-shell .shell-logo{font-weight:700;font-size:20px;letter-spacing:-0.02em;color:#1a1a2e}
      .dark #root-shell .shell-logo{color:#f1f5f9}
      #root-shell .shell-hero{margin:16px;height:200px;border-radius:16px;background:linear-gradient(135deg,rgba(0,0,0,.04),rgba(0,0,0,.02))}
      .dark #root-shell .shell-hero{background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.02))}
      #root:not(:empty)+#root-shell{display:none}
    </style>
  </head>

  <body>
    <div id="root"></div>
    <!-- Lightweight shell visible until React mounts — provides instant FCP -->
    <div id="root-shell" aria-hidden="true">
      <div class="shell-header"><span class="shell-logo">Odhra</span></div>
      <div class="shell-hero"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
